<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17"/>
      <stop offset="50%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181924" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#12131c" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanGlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="dropShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Window Chrome -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad2)" stroke="#222436" stroke-width="1.5" filter="url(#dropShadow2)"/>

  <!-- Top Window Header / Title Bar -->
  <rect width="900" height="42" rx="16" fill="#13141f" stroke="#222436" stroke-width="1"/>
  <!-- Traffic Lights -->
  <circle cx="28" cy="21" r="6" fill="#fb7185"/>
  <circle cx="48" cy="21" r="6" fill="#fbbf24"/>
  <circle cx="68" cy="21" r="6" fill="#4ade80"/>
  
  <!-- URL Bar -->
  <rect x="130" y="10" width="640" height="22" rx="6" fill="#090a0f" stroke="#25273c" stroke-width="1"/>
  <text x="340" y="25" fill="#a9acbd" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500">hubs/eCTHP.html — Certified Threat Hunting Professional</text>
  
  <!-- Content Area: eCTHP UI Preview -->
  <!-- Ambient glow effects -->
  <circle cx="180" cy="200" r="150" fill="#06b6d4" opacity="0.12" filter="blur(55px)"/>
  <circle cx="720" cy="380" r="160" fill="#10b981" opacity="0.08" filter="blur(60px)"/>

  <!-- Site Brand Header -->
  <rect x="50" y="65" width="48" height="48" rx="12" fill="#06b6d4" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="74" cy="89" r="12" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <line x1="74" y1="71" x2="74" y2="77" stroke="#38bdf8" stroke-width="2"/>
  <line x1="74" y1="101" x2="74" y2="107" stroke="#38bdf8" stroke-width="2"/>
  <line x1="56" y1="89" x2="62" y2="89" stroke="#38bdf8" stroke-width="2"/>
  <line x1="86" y1="89" x2="92" y2="89" stroke="#38bdf8" stroke-width="2"/>

  <text x="112" y="86" fill="#f7f7fb" font-family="Inter, sans-serif" font-size="18" font-weight="700">eCTHP Study Hub</text>
  <text x="112" y="103" fill="#a9acbd" font-family="Inter, sans-serif" font-size="12">INE Certified Threat Hunting Professional Reference</text>

  <!-- Status Pill -->
  <rect x="710" y="72" width="140" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1"/>
  <circle cx="726" cy="86" r="4" fill="#22d3ee"/>
  <text x="738" y="90" fill="#22d3ee" font-family="Inter, sans-serif" font-size="11" font-weight="600">5 HUNTING TRACKS</text>

  <!-- Shortcut Pills / Navigation Bar -->
  <rect x="50" y="130" width="800" height="42" rx="10" fill="#13141f" stroke="#222436" stroke-width="1"/>
  <rect x="60" y="136" width="135" height="30" rx="8" fill="#06b6d4" fill-opacity="0.3" stroke="#22d3ee" stroke-width="1"/>
  <text x="75" y="156" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">01. Intro to Hunting</text>
  <text x="220" y="156" fill="#a9acbd" font-family="Inter, sans-serif" font-size="12">02. Threat Intelligence</text>
  <text x="390" y="156" fill="#a9acbd" font-family="Inter, sans-serif" font-size="12">03. Hunting Strategies</text>
  <text x="560" y="156" fill="#a9acbd" font-family="Inter, sans-serif" font-size="12">04. Network Hunting</text>
  <text x="715" y="156" fill="#a9acbd" font-family="Inter, sans-serif" font-size="12">05. Endpoint Hunting</text>

  <!-- 3 Modular Cards Preview -->
  <!-- Card 1: Intelligence in Threat Hunting -->
  <rect x="50" y="195" width="250" height="285" rx="12" fill="url(#cardGrad2)" stroke="#27293d" stroke-width="1"/>
  <rect x="50" y="195" width="250" height="4" rx="2" fill="url(#cyanGlow2)"/>
  <text x="70" y="225" fill="#22d3ee" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1">COURSE 02</text>
  <text x="70" y="248" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="700">Threat Intelligence</text>
  <text x="70" y="270" fill="#a9acbd" font-family="Inter, sans-serif" font-size="11">Diamond Model, Pyramid of Pain</text>
  <line x1="70" y1="285" x2="280" y2="285" stroke="#25273c"/>
  <rect x="70" y="300" width="210" height="24" rx="4" fill="#1f2133"/>
  <text x="80" y="316" fill="#cbd5e1" font-family="monospace" font-size="10">Adversary TTP Mapping</text>
  <rect x="70" y="332" width="210" height="24" rx="4" fill="#1f2133"/>
  <text x="80" y="348" fill="#cbd5e1" font-family="monospace" font-size="10">MISP &amp; STIX/TAXII Feeds</text>
  <rect x="70" y="364" width="210" height="24" rx="4" fill="#1f2133"/>
  <text x="80" y="380" fill="#cbd5e1" font-family="monospace" font-size="10">ATT&amp;CK Matrix Navigator</text>
  <rect x="70" y="420" width="210" height="34" rx="6" fill="#0891b2" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
  <text x="120" y="442" fill="#22d3ee" font-family="Inter, sans-serif" font-size="12" font-weight="600">Inspect Track</text>

  <!-- Card 2: Network Threat Hunting -->
  <rect x="325" y="195" width="250" height="285" rx="12" fill="url(#cardGrad2)" stroke="#27293d" stroke-width="1"/>
  <rect x="325" y="195" width="250" height="4" rx="2" fill="url(#emeraldGlow)"/>
  <text x="345" y="225" fill="#10b981" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1">COURSE 04</text>
  <text x="345" y="248" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="700">Network Hunting</text>
  <text x="345" y="270" fill="#a9acbd" font-family="Inter, sans-serif" font-size="11">Beaconing, Tunneling, C2 Outliers</text>
  <line x1="345" y1="285" x2="555" y2="285" stroke="#25273c"/>
  <rect x="345" y="300" width="210" height="24" rx="4" fill="#1f2133"/>
  <text x="355" y="316" fill="#cbd5e1" font-family="monospace" font-size="10">RITA: Beacon Score Analysis</text>
  <rect x="345" y="332" width="210" height="24" rx="4" fill="#1f2133"/>
  <text x="355" y="348" fill="#cbd5e1" font-family="monospace" font-size="10">JA3/JA3S Fingerprinting</text>
  <rect x="345" y="364" width="210" height="24" rx="4" fill="#1f2133"/>
  <text x="355" y="380" fill="#cbd5e1" font-family="monospace" font-size="10">DNS Length &amp; Entropy Hunt</text>
  <rect x="345" y="420" width="210" height="34" rx="6" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="395" y="442" fill="#10b981" font-family="Inter, sans-serif" font-size="12" font-weight="600">Inspect Track</text>

  <!-- Card 3: Endpoint Threat Hunting -->
  <rect x="600" y="195" width="250" height="285" rx="12" fill="url(#cardGrad2)" stroke="#27293d" stroke-width="1"/>
  <rect x="600" y="195" width="250" height="4" rx="2" fill="url(#cyanGlow2)"/>
  <text x="620" y="225" fill="#22d3ee" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1">COURSE 05</text>
  <text x="620" y="248" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="700">Endpoint Hunting</text>
  <text x="620" y="270" fill="#a9acbd" font-family="Inter, sans-serif" font-size="11">Memory, DLL Hijacking, WMI</text>
  <line x1="620" y1="285" x2="830" y2="285" stroke="#25273c"/>
  <rect x="620" y="300" width="210" height="24" rx="4" fill="#1f2133"/>
  <text x="630" y="316" fill="#cbd5e1" font-family="monospace" font-size="10">Volatility: malfind &amp; psxview</text>
  <rect x="620" y="332" width="210" height="24" rx="4" fill="#1f2133"/>
  <text x="630" y="348" fill="#cbd5e1" font-family="monospace" font-size="10">Sysmon Event ID 8 (CreateThread)</text>
  <rect x="620" y="364" width="210" height="24" rx="4" fill="#1f2133"/>
  <text x="630" y="380" fill="#cbd5e1" font-family="monospace" font-size="10">Autoruns &amp; Registry Run Keys</text>
  <rect x="620" y="420" width="210" height="34" rx="6" fill="#0891b2" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
  <text x="670" y="442" fill="#22d3ee" font-family="Inter, sans-serif" font-size="12" font-weight="600">Inspect Track</text>
</svg>
